{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women | MH24 Collection</title>

    <!-- ✅ FIXED STATIC CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <section class="category-hero">
        <h1>WOMEN COLLECTION</h1>
        <p>Fashion which boosts your Confidence!</p>
    </section>

    <section class="products">
        <div class="product-grid" id="product-container">
            <!-- Products will load dynamically -->
        </div>
    </section>

    <!-- Optional: force category -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (!urlParams.get("category")) {
            window.location.search = "?category=Women";
        }
    </script>

    <!-- ✅ FIXED STATIC JS -->
    <script src="{% static 'js/products.js' %}"></script>
    <script src="{% static 'js/cart.js' %}"></script>
    <script src="{% static 'js/favourites.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>

</body>

</html>
