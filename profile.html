<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile | MH24</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header>
    <div class="navbar">

        <a href="index.html">
            <img src="newlogo-removebg-preview.png" height="40">
        </a>

        <div class="nav-right">

            <a href="shop.html">Shop</a>
            <a href="cart.html">Cart</a>

            <a href="profile.html">
                <i class="fa-solid fa-user"></i>
                Account
            </a>

            <a href="#" onclick="logoutUser()">
                <i class="fa-solid fa-right-from-bracket"></i>
            </a>

        </div>

    </div>
</header>

<section class="profile-container">

    <div class="profile-card">

        <!-- LEFT -->
        <div class="profile-left">

            <img src="user.png" class="profile-pic">

            <h2 id="profile-name">User</h2>
            <p id="profile-email">user@email.com</p>

            <button onclick="logoutUser()">Logout</button>

        </div>

        <!-- RIGHT -->
        <div class="profile-right">

            <h3>Account Details</h3>

            <p>Name: <span id="profile-name2"></span></p>
            <p>Email: <span id="profile-email2"></span></p>

        </div>

    </div>

</section>

<script>
    // ================= LOAD USER =================
    const user = JSON.parse(localStorage.getItem("user"));

    if (!user) {
        window.location.href = "signin.html";
    } else {
        document.getElementById("profile-name").innerText = user.name;
        document.getElementById("profile-email").innerText = user.email;

        document.getElementById("profile-name2").innerText = user.name;
        document.getElementById("profile-email2").innerText = user.email;
    }

    // ================= LOGOUT =================
    async function logoutUser() {
        await fetch("http://127.0.0.1:8000/api/logout/", {
            method: "POST",
            credentials: "include"
        });

        localStorage.removeItem("user");
        window.location.href = "signin.html";
    }
</script>

</body>
</html>
